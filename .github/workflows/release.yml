name: Build, Test & Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".gitattributes"
      - "SConstruct"
      - "scripts/**"
      - "src/**"
      - "third-party/SConscript.rive"
      - "third-party/godot-cpp"
      - "third-party/rive-runtime"
      - ".gitmodules"
      - "project/addons/godot-rive/godot-rive.gdextension"
      - "project/addons/godot-rive/helpers/**"
      - "project/assets/fonts/InterVariable.ttf"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing release tag to attach the package to; blank means artifact only."
        required: false
        default: ""
      platforms:
        description: "Comma-separated subset of macos,windows,linux,android; use all for every platform."
        required: false
        default: "all"

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      package_label: ${{ steps.matrix.outputs.package_label }}
      full_matrix: ${{ steps.matrix.outputs.full_matrix }}
      has_linux: ${{ steps.matrix.outputs.has_linux }}
    steps:
      - id: matrix
        name: Validate inputs
        shell: bash
        env:
          PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          configurations = [
              {
                  "name": "macos-universal",
                  "runner": "macos-14",
                  "platform": "macos",
                  "shader_platform": "macos",
                  "arch": "universal",
              },
              {
                  "name": "windows-x86_64",
                  "runner": "windows-2022",
                  "platform": "windows",
                  "shader_platform": "windows",
                  "arch": "x86_64",
              },
              {
                  "name": "linux-x86_64",
                  "runner": "ubuntu-22.04",
                  "platform": "linux",
                  "shader_platform": "linux",
                  "arch": "x86_64",
              },
              {
                  "name": "android-arm64",
                  "runner": "ubuntu-22.04",
                  "platform": "android",
                  "shader_platform": "android",
                  "arch": "arm64",
              },
          ]

          requested = os.environ.get("PLATFORMS", "all").strip()
          available = {configuration["platform"] for configuration in configurations}
          selected = available
          if requested != "all":
              selected = {item.strip() for item in requested.split(",") if item.strip()}
              unknown = selected - available
              if unknown:
                  raise SystemExit(f"Unknown platforms: {', '.join(sorted(unknown))}")
              if not selected:
                  raise SystemExit("At least one platform must be selected")
              configurations = [
                  configuration
                  for configuration in configurations
                  if configuration["platform"] in selected
              ]

          raw_release_tag = os.environ.get("RELEASE_TAG", "")
          release_tag = raw_release_tag.strip()
          if raw_release_tag and not release_tag:
              raise SystemExit("The release tag cannot contain only whitespace")
          if release_tag and selected != available:
              raise SystemExit("A release package must include all supported platforms")

          label = release_tag or os.environ["GITHUB_SHA"][:12]
          label = re.sub(r"[^0-9A-Za-z._-]+", "-", label).strip("-.")
          if not label:
              raise SystemExit("The package label is empty after sanitization")

          print("matrix=" + json.dumps(configurations, separators=(",", ":")))
          print("package_label=" + label)
          print("full_matrix=" + str(selected == available).lower())
          print("has_linux=" + str("linux" in selected).lower())
          PY

  build:
    name: ${{ matrix.config.name }} (${{ matrix.target }})
    needs: setup
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: [template_debug, template_release]
        config: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Python build tools
        shell: bash
        run: |
          set -euo pipefail
          requirements="$RUNNER_TEMP/rivegd-build-requirements.txt"
          printf '%s\n' \
            'scons==4.10.1 --hash=sha256:bd9d1c52f908d874eba92a8c0c0a8dcf2ed9f3b88ab956d0fce1da479c4e7126' \
            'ply==3.11 --hash=sha256:096f9b8350b65ebd2fd1346b12452efe5b9607f7482813ffca50c22722a807ce' \
            > "$requirements"
          python -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --requirement "$requirements"

      - name: Install Linux build dependencies
        if: matrix.config.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            glslang-tools \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            spirv-tools

      - name: Install and verify Android NDK 28
        if: matrix.config.platform == 'android'
        shell: bash
        env:
          NDK_VERSION: 28.1.13356709
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$sdk_root" --install "ndk;$NDK_VERSION"
          ndk_root="$sdk_root/ndk/$NDK_VERSION"
          test -x "$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"
          echo "RIVEGD_NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: matrix.config.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Vulkan SDK
        if: matrix.config.platform == 'windows' || matrix.config.platform == 'linux' || matrix.config.platform == 'android'
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: 1.4.321.1
          install_runtime: false
          cache: true
          stripdown: false

      - name: Verify Vulkan SDK headers
        if: matrix.config.platform == 'windows' || matrix.config.platform == 'linux' || matrix.config.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VULKAN_SDK:-}"
          if test -f "$VULKAN_SDK/Include/vulkan/vulkan.h"; then
            test -s "$VULKAN_SDK/Include/vulkan/vulkan.h"
          else
            test -s "$VULKAN_SDK/include/vulkan/vulkan.h"
          fi

      - name: Install pinned Vulkan Memory Allocator header
        if: matrix.config.platform == 'windows' || matrix.config.platform == 'linux' || matrix.config.platform == 'android'
        shell: bash
        env:
          VMA_COMMIT: 1d8f600fd424278486eade7ed3e877c99f0846b1
          VMA_SHA256: 90ce12fc4a2466235a09ae02905dd0c13aee80c1bbf11b331ab61230c2ceb112
        run: |
          set -euo pipefail
          vma_header="$RUNNER_TEMP/vk_mem_alloc.h"
          curl --fail --location --show-error --silent \
            --output "$vma_header" \
            "https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/$VMA_COMMIT/include/vk_mem_alloc.h"
          echo "$VMA_SHA256  $vma_header" | sha256sum --check --strict
          installed=false
          for include_dir in "$VULKAN_SDK/Include" "$VULKAN_SDK/include"; do
            if test -d "$include_dir"; then
              mkdir -p "$include_dir/vma"
              cp "$vma_header" "$include_dir/vk_mem_alloc.h"
              cp "$vma_header" "$include_dir/vma/vk_mem_alloc.h"
              installed=true
            fi
          done
          test "$installed" = true

      - name: Install pinned DirectX-Headers
        if: matrix.config.platform == 'windows'
        shell: bash
        env:
          DX_HEADERS_COMMIT: 27d63115c1037d0e4e119085f34345bd9ecf7ada
          DX_HEADERS_SHA256: 9dab2a33b3c32c9a8dd34a0886e95abfae3e49eba6f5920a3f1637a8e278f69c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/directx-headers.zip"
          curl --fail --location --show-error --silent \
            --output "$archive" \
            "https://codeload.github.com/microsoft/DirectX-Headers/zip/$DX_HEADERS_COMMIT"
          echo "$DX_HEADERS_SHA256  $archive" | sha256sum --check --strict
          python -m zipfile -e "$archive" "$RUNNER_TEMP/directx-headers"
          headers_path="$RUNNER_TEMP/directx-headers/DirectX-Headers-$DX_HEADERS_COMMIT"
          test -s "$headers_path/include/directx/d3dx12.h"
          echo "DIRECTX_HEADERS_PATH=$headers_path" >> "$GITHUB_ENV"

      - name: Generate Rive shaders
        shell: bash
        run: |
          set -euo pipefail
          pycmd=python
          if command -v python3 >/dev/null 2>&1; then pycmd=python3; fi
          "$pycmd" scripts/build_shaders.py \
            third-party/rive-runtime/renderer/src/shaders \
            third-party/rive-runtime/renderer/include/generated/shaders \
            "${{ matrix.config.shader_platform }}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)"
          options=(
            "platform=${{ matrix.config.platform }}"
            "target=${{ matrix.target }}"
            "arch=${{ matrix.config.arch }}"
            "-j$jobs"
          )
          if test "${{ matrix.config.platform }}" = android; then
            test -n "$RIVEGD_NDK_VERSION"
            options+=("ndk_version=$RIVEGD_NDK_VERSION")
          fi
          scons "${options[@]}"

      - name: Stage and validate exact artifact
        shell: bash
        env:
          RIVEGD_BUILD_PLATFORM: ${{ matrix.config.platform }}
          RIVEGD_BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          addon_source="project/addons/godot-rive"
          addon_stage="staged/addons/godot-rive"
          configuration=debug
          if test "$RIVEGD_BUILD_TARGET" = template_release; then configuration=release; fi

          case "$RIVEGD_BUILD_PLATFORM" in
            linux)
              descriptor_key="linux.$configuration.x86_64"
              artifact="bin/libgodot-rive.linux.$configuration.x86_64.so"
              ;;
            windows)
              descriptor_key="windows.$configuration.x86_64"
              artifact="bin/libgodot-rive.windows.$configuration.x86_64.dll"
              ;;
            macos)
              descriptor_key="macos.$configuration"
              artifact="bin/libgodot-rive.macos.$configuration.framework"
              ;;
            android)
              descriptor_key="android.$configuration.arm64"
              artifact="bin/libgodot-rive.android.$configuration.arm64.so"
              ;;
            *)
              echo "Unsupported platform: $RIVEGD_BUILD_PLATFORM" >&2
              exit 1
              ;;
          esac

          test -e "$addon_source/$artifact"
          if test "$RIVEGD_BUILD_PLATFORM" = macos; then
            framework_binary="$addon_source/$artifact/libgodot-rive.macos.$configuration"
            test -s "$framework_binary"
            file "$framework_binary" | grep -q "Mach-O"
          else
            test -s "$addon_source/$artifact"
          fi
          if test "$RIVEGD_BUILD_PLATFORM" = android; then
            ELF_ARTIFACT="$addon_source/$artifact" python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          readelf = Path(os.environ["ANDROID_NDK_ROOT"]) / "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          output = subprocess.check_output(
              [str(readelf), "--program-headers", "--wide", os.environ["ELF_ARTIFACT"]],
              text=True,
          )
          loads = [line.split() for line in output.splitlines() if line.strip().startswith("LOAD ")]
          if not loads:
              raise SystemExit("The Android binary has no ELF LOAD segments")
          for load in loads:
              alignment = int(load[-1], 0)
              if alignment < 16384:
                  raise SystemExit(f"Android LOAD segment alignment is below 16 KB: {alignment}")
          print("Android ELF LOAD segments satisfy 16 KB page alignment")
          PY
          fi
          test -s "$addon_source/godot-rive.gdextension"
          test -s "$addon_source/godot-rive.gdextension.uid"
          mkdir -p "$addon_stage/bin"
          cp "$addon_source/godot-rive.gdextension" "$addon_stage/"
          cp "$addon_source/godot-rive.gdextension.uid" "$addon_stage/"
          cp -R "$addon_source/helpers" "$addon_stage/helpers"
          cp -R "$addon_source/$artifact" "$addon_stage/bin/"
          printf '%s\n' "$artifact" > "$addon_stage/artifact-manifest.txt"

          DESCRIPTOR_KEY="$descriptor_key" ARTIFACT="$artifact" python - <<'PY'
          import configparser
          import os
          from pathlib import Path

          addon = Path("staged/addons/godot-rive")
          parser = configparser.ConfigParser(interpolation=None)
          loaded = parser.read(addon / "godot-rive.gdextension", encoding="utf-8")
          if not loaded:
              raise SystemExit("Could not read the staged GDExtension descriptor")
          key = os.environ["DESCRIPTOR_KEY"]
          expected = os.environ["ARTIFACT"]
          actual = parser["libraries"].get(key, "").strip().strip('"')
          if actual != expected:
              raise SystemExit(f"Descriptor {key!r} maps to {actual!r}, expected {expected!r}")
          if not (addon / actual).exists():
              raise SystemExit(f"Descriptor target is missing: {actual}")
          PY

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-rive-${{ matrix.config.name }}-${{ matrix.target }}
          path: staged
          if-no-files-found: error
          retention-days: 14

  smoke-linux:
    name: Linux Vulkan smoke (Godot ${{ matrix.godot_version }})
    needs: [setup, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.setup.outputs.has_linux == 'true' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot_version: "4.5"
            archive_sha512: b5bd5d8a4dd3f44de1d123361beabaafa4825dd05b5e20fd2bfa540f32594f81d82e7c4e86fae420f4faee77d9def573b570f8b156e9c84a4dc2d5123d09e852
          - godot_version: "4.6"
            archive_sha512: 0c1bc5e8dca8f892a9a5fd0628b742f399fbd520e5f0051ecac021c0aa4ea5a8f0d237c8ed6b767b2afda7f7a4b32001118f1b04a82e335a5e35b947a1217940
    steps:
      - name: Checkout smoke-test scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Download Linux debug artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: godot-rive-linux-x86_64-template_debug
          path: smoke-project

      - name: Install smoke-test dependencies
        run: |
          sudo apt-get update
          audio_package=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            audio_package=libasound2t64
          fi
          sudo apt-get install --no-install-recommends -y \
            "$audio_package" \
            libfontconfig1 \
            libgl1 \
            libx11-6 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            mesa-vulkan-drivers \
            unzip \
            xauth \
            xvfb

      - name: Download and verify Godot
        shell: bash
        env:
          GODOT_VERSION: ${{ matrix.godot_version }}
          GODOT_SHA512: ${{ matrix.archive_sha512 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          curl --fail --location --show-error --silent \
            --output "$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
          echo "$GODOT_SHA512  $archive" | sha512sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          godot="$RUNNER_TEMP/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64"
          chmod +x "$godot"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"

      - name: Load extension with Vulkan
        shell: bash
        run: |
          set -euo pipefail
          test -s smoke-project/addons/godot-rive/bin/libgodot-rive.linux.debug.x86_64.so
          mkdir -p smoke-project/.godot
          printf '%s\n' \
            'config_version=5' \
            '' \
            '[application]' \
            'config/name="RiveGD smoke"' \
            '' \
            '[rendering]' \
            'renderer/rendering_method="mobile"' \
            'renderer/rendering_method.mobile="mobile"' \
            > smoke-project/project.godot
          printf '%s\n' 'res://addons/godot-rive/godot-rive.gdextension' \
            > smoke-project/.godot/extension_list.cfg

          set +e
          timeout 60s xvfb-run --auto-servernum "$GODOT_BIN" \
            --display-driver x11 \
            --editor \
            --path smoke-project \
            --quit-after 2 \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --verbose \
            > godot-smoke.log 2>&1
          status=$?
          set -e
          cat godot-smoke.log
          test "$status" -eq 0
          grep -F "Rive renderer initialized." godot-smoke.log
          if grep -E \
            "Cannot open dynamic library|GDExtension.*(failed|error)|Rive renderer initialization failed|Rive: Vulkan support not compiled in" \
            godot-smoke.log; then
            exit 1
          fi

      - name: Download and verify pinned ViewModel fixtures
        shell: bash
        env:
          RIVE_FIXTURE_COMMIT: 820cc19bd8405f84a8f85f9f388a133d6a2c7511
        run: |
          set -euo pipefail
          fixture_dir="third-party/rive-runtime/tests/unit_tests/assets"
          mkdir -p "$fixture_dir"
          while read -r checksum filename; do
            mkdir -p "$(dirname "$fixture_dir/$filename")"
            curl --fail --location --show-error --silent \
              --output "$fixture_dir/$filename" \
              "https://raw.githubusercontent.com/rive-app/rive-runtime/$RIVE_FIXTURE_COMMIT/tests/unit_tests/assets/$filename"
            echo "$checksum  $fixture_dir/$filename" | sha256sum --check --strict
          done <<'FIXTURES'
          054219ac8b15e384c8026c1ba9340385300fd00c649d8b787671d0d6fd7493b8 data_bind_test_cmdq.riv
          8d3bdbfafc41b7a18b6052c69a40b953a0d4b388b806e2fce9ea9db3ade42299 data_bind_font_test.riv
          d32ce8f143fbb4fcda7eb09ef956a808d48e42f50a538f79284a70368a14b3aa data_binding_artboards_test.riv
          051df46dd343275c427463a9e7c4fa39528b180d90eaaa8c5cb715b344a66bc4 kablammo.ttf
          098490378578565b1b9e326a422cad54914bbaf6df68e373be3050265a399d86 nabla.ttf
          d7153648bcf2d663429b21b6caec26e671c13b1ee8e3b90f0a9eaef7fd38c3fa timeline_event_test.riv
          011407faa0f4eba9576556c4733e524d8989bc489d75ff35afba31ff88fc3598 event_on_listener.riv
          6ddadcf1849216896a44fa1edaaa7617b21bfaab835e136de27dba61f98d0317 state_transition_fire_trigger.riv
          37adafd045b466dd575e5cd8585d5339d0e5d62e8d8ec93dc42bb056888af30e out_of_band/walle.riv
          6caae10389951be6a96bb1a6791de4db515ad07460c2751e8d6d4ddcf36c5e5b out_of_band/walle-370.png
          442ae85346bd5422ef36738f535d6e6bf066b801b26d4d1889d871af108e2972 out_of_band/eve-317.png
          FIXTURES

      - name: Download and verify pinned official QoL samples
        shell: bash
        env:
          RIVE_EXAMPLE_COMMIT: 58fcac2171f655757907356a4bead2ebd008e4f7
        run: |
          set -euo pipefail
          sample_dir="$RUNNER_TEMP/rivegd-official-samples"
          mkdir -p "$sample_dir"
          while read -r checksum filename; do
            curl --fail --location --show-error --silent \
              --output "$sample_dir/$filename" \
              "https://raw.githubusercontent.com/rive-app/rive-flutter/$RIVE_EXAMPLE_COMMIT/example/assets/$filename"
            echo "$checksum  $sample_dir/$filename" | sha256sum --check --strict
          done <<'SAMPLES'
          12cc0f18866432afe84b923680f7aa9d074c175587ceb882d8f057a6aa3e141f lists_demo.riv
          e153076afb9604a1dfda7f721053bf9fba9951b81e9aa54255fa3fa345a569d9 travel_icons_pack.riv
          SAMPLES
          echo "RIVE_QOL_SAMPLES=$sample_dir" >> "$GITHUB_ENV"

      - name: Run ViewModel and scene-serialization regression with Vulkan
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/view_model_smoke_test.gd
          set +e
          timeout 120s xvfb-run --auto-servernum "$GODOT_BIN" \
            --display-driver x11 \
            --path smoke-project \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --render-thread safe \
            --script "$GITHUB_WORKSPACE/scripts/view_model_smoke_test.gd" \
            > godot-view-model-smoke.log 2>&1
          status=$?
          set -e
          cat godot-view-model-smoke.log
          test "$status" -eq 0
          grep -F "RIVE_VIEW_MODEL_SMOKE_PASS:" godot-view-model-smoke.log
          if grep -E \
            "RIVE_VIEW_MODEL_SMOKE_FAIL:|Cannot open dynamic library|GDExtension.*(failed|error)|Rive renderer initialization failed|SCRIPT ERROR:" \
            godot-view-model-smoke.log; then
            exit 1
          fi

      - name: Run native Inspector and persistent list editing regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run --auto-servernum python3 scripts/run_inspector_smoke_test.py \
            --godot "$GODOT_BIN" --display-driver x11 \
            --addon-path smoke-project/addons/godot-rive \
            | tee godot-inspector-smoke.log

      - name: Run scene, binding, event, layout and texture integration regression
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/integration_smoke_test.gd
          set +e
          timeout 120s xvfb-run --auto-servernum "$GODOT_BIN" \
            --display-driver x11 \
            --path smoke-project \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --render-thread safe \
            --resolution 1024x640 \
            --script "$GITHUB_WORKSPACE/scripts/integration_smoke_test.gd" \
            > godot-integration-smoke.log 2>&1
          status=$?
          set -e
          cat godot-integration-smoke.log
          test "$status" -eq 0
          grep -F "RIVE_INTEGRATION_SMOKE_PASS:" godot-integration-smoke.log
          if grep -E \
            "RIVE_INTEGRATION_SMOKE_FAIL:|Cannot open dynamic library|GDExtension.*(failed|error)|Rive renderer initialization failed|SCRIPT ERROR:" \
            godot-integration-smoke.log; then
            exit 1
          fi

      - name: Run factories, presets, assets and repeated native lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          test -s scripts/qol_smoke_test.gd
          set +e
          timeout 120s xvfb-run --auto-servernum "$GODOT_BIN" \
            --display-driver x11 \
            --path smoke-project \
            --rendering-method mobile \
            --rendering-driver vulkan \
            --render-thread safe \
            --resolution 1024x640 \
            --script "$GITHUB_WORKSPACE/scripts/qol_smoke_test.gd" \
            -- "$RIVE_QOL_SAMPLES" \
            > godot-qol-smoke.log 2>&1
          status=$?
          set -e
          cat godot-qol-smoke.log
          test "$status" -eq 0
          grep -F "RIVE_QOL_SMOKE_PASS:" godot-qol-smoke.log
          if grep -E \
            "RIVE_QOL_SMOKE_FAIL:|Cannot open dynamic library|GDExtension.*(failed|error)|Rive renderer initialization failed|ERROR:|leaked|resources still in use" \
            godot-qol-smoke.log; then
            exit 1
          fi

      - name: Download pinned runtime API fixtures
        shell: bash
        env:
          RIVE_FIXTURE_COMMIT: 820cc19bd8405f84a8f85f9f388a133d6a2c7511
        run: |
          set -euo pipefail
          fixture_dir="third-party/rive-runtime/tests/unit_tests/assets"
          while read -r checksum filename; do
            mkdir -p "$(dirname "$fixture_dir/$filename")"
            curl --fail --location --show-error --silent \
              --output "$fixture_dir/$filename" \
              "https://raw.githubusercontent.com/rive-app/rive-runtime/$RIVE_FIXTURE_COMMIT/tests/unit_tests/assets/$filename"
            echo "$checksum  $fixture_dir/$filename" | sha256sum --check --strict
          done <<'FIXTURES'
          61a14d72c5b9694b675d729e756fd4e3d0a075bf76ed545d07b62c301af962a0 runtime_nested_inputs.riv
          d7153648bcf2d663429b21b6caec26e671c13b1ee8e3b90f0a9eaef7fd38c3fa timeline_event_test.riv
          c2ef8563c393c9f375338cd034d8298e72c4f910a449e929ef780348840457a7 two_bone_ik.riv
          74b8d53be35399019c09b8f4cf36c0d4447df2c1825f79e9534772424fd07cb8 joystick_flag_test.riv
          b8fe924f342d90fe601a668e3393988714346dfa643e3e1020cc9bbe2f77c330 gamepad_test.riv
          46b47578e6dd6e70ecffac35449498275fd2ee8773efbc5cb04d22cad5fb7e58 data_bind_blob_test.riv
          48f122b40bbe487690efc55057e1e9f42593a1b51fe93e4a2d40eaaa725f0fa0 list_index_script_access.riv
          98fa6ed336edea620ef83f6d7a215fdb2cc1da3d0a8557ff1746f556ef1973ea new_text.riv
          718b80e13fc25f89c34b66fb01732f7ea1eac924ff06ca6b2caa5ed882324a72 text_input.riv
          3e28691c3d3d5f09ba4ca3393f7e8f82dc3fbd72d398a7d239688c2756191c94 semantic/simpsons.riv
          1118a402b5eabda347c416e49391bdc156836abfc0aca93ae9f1fbddfab2af28 IBMPlexSansArabic-Regular.ttf
          37adafd045b466dd575e5cd8585d5339d0e5d62e8d8ec93dc42bb056888af30e out_of_band/walle.riv
          6caae10389951be6a96bb1a6791de4db515ad07460c2751e8d6d4ddcf36c5e5b out_of_band/walle-370.png
          442ae85346bd5422ef36738f535d6e6bf066b801b26d4d1889d871af108e2972 out_of_band/eve-317.png
          FIXTURES
          mkdir -p smoke-project/assets/fonts
          cp project/assets/fonts/InterVariable.ttf smoke-project/assets/fonts/
          for helper in rive_accessibility_bridge rive_asset_loader rive_component_follower rive_text_selection; do
            test -s "smoke-project/addons/godot-rive/helpers/$helper.gd"
          done

      - name: Run runtime API, helper and advanced vector regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in runtime_api runtime_helpers advanced_vector; do
            log="godot-${suite}.log"
            set +e
            timeout 120s xvfb-run --auto-servernum "$GODOT_BIN" \
              --display-driver x11 --path smoke-project \
              --rendering-method mobile --rendering-driver vulkan \
              --render-thread safe --resolution 1024x640 \
              --script "$GITHUB_WORKSPACE/scripts/${suite}_smoke_test.gd" > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -eq 0
            grep -F "${suite^^}_SMOKE_PASS" "$log"
            if grep -E 'ERROR:|leaked|resources still in use|Cannot open dynamic library|Rive renderer initialization failed' "$log"; then
              exit 1
            fi
          done

  package:
    name: Validate and package addon
    needs: [setup, build, smoke-linux]
    if: ${{ !cancelled() && needs.setup.outputs.full_matrix == 'true' && needs.build.result == 'success' && (needs.smoke-linux.result == 'success' || needs.smoke-linux.result == 'skipped') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: godot-rive-*-template_*
          path: dist

      - name: Merge exact binaries and validate descriptor
        shell: bash
        env:
          PACKAGE_LABEL: ${{ needs.setup.outputs.package_label }}
        run: |
          set -euo pipefail
          addon="package/addons/godot-rive"
          mkdir -p "$addon/bin"
          shopt -s nullglob
          sources=(dist/*/addons/godot-rive)
          test "${#sources[@]}" -gt 0

          cp "${sources[0]}/godot-rive.gdextension" "$addon/"
          cp "${sources[0]}/godot-rive.gdextension.uid" "$addon/"
          cp -R "${sources[0]}/helpers" "$addon/helpers"
          for source in "${sources[@]}"; do
            cmp "$source/godot-rive.gdextension" "$addon/godot-rive.gdextension"
            cmp "$source/godot-rive.gdextension.uid" "$addon/godot-rive.gdextension.uid"
            diff -r "$source/helpers" "$addon/helpers"
            test -s "$source/artifact-manifest.txt"
            IFS= read -r artifact < "$source/artifact-manifest.txt"
            case "$artifact" in
              bin/*) ;;
              *) echo "Invalid artifact manifest path: $artifact" >&2; exit 1 ;;
            esac
            entry="$source/$artifact"
            destination="$addon/$artifact"
            test -e "$entry"
            test ! -e "$destination"
            cp -R "$entry" "$destination"
          done

          python - <<'PY'
          import configparser
          from pathlib import Path

          addon = Path("package/addons/godot-rive")
          parser = configparser.ConfigParser(interpolation=None)
          parser.read(addon / "godot-rive.gdextension", encoding="utf-8")
          expected = set()
          for key, quoted_path in parser["libraries"].items():
              path = quoted_path.strip().strip('"')
              target = addon / path
              if not target.exists():
                  raise SystemExit(f"Missing descriptor target for {key}: {path}")
              expected.add(Path(path).name)
          actual = {path.name for path in (addon / "bin").iterdir()}
          if actual != expected:
              raise SystemExit(
                  f"Packaged bin entries differ from descriptor: "
                  f"missing={sorted(expected - actual)}, extra={sorted(actual - expected)}"
              )
          PY

          archive="godot-rive-$PACKAGE_LABEL.zip"
          (cd package && zip -q -r "../$archive" addons)
          test -s "$archive"

      - name: Upload merged package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: godot-rive-addon-${{ needs.setup.outputs.package_label }}
          path: godot-rive-${{ needs.setup.outputs.package_label }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Verify manual release tag exists
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null

      - name: Attach package to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          files: godot-rive-${{ needs.setup.outputs.package_label }}.zip
          fail_on_unmatched_files: true
